[project.optional-dependencies]
full = [
  "deepspeed",
  "tensorrt",
  "mamba-ssm",
  "onnx",
  "onnxruntime",
  "onnx_graphsurgeon",
  "colored",
]

[project.scripts]
mmrun = "mgamdata.mm.run:main"
